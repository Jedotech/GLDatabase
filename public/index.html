<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLDatabase — Buyer & Supplier Sourcing Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col" x-data="glApp()" x-init="init()">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-900 text-white px-6 py-3.5 shadow-md flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
    <div class="flex items-center gap-6">
      <div>
        <h1 class="text-lg font-bold tracking-tight flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
          GLDatabase
        </h1>
        <p class="text-[11px] text-slate-400">Buyer Requirements &harr; Supplier Catalogs</p>
      </div>

      <!-- Separate Page Switcher -->
      <nav class="flex bg-slate-800 p-1 rounded-lg text-xs font-semibold">
        <button @click="page = 'buyers'"
                :class="page === 'buyers' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'"
                class="px-4 py-1.5 rounded-md transition flex items-center gap-1.5">
          Buyers Page
          <span class="bg-black/25 px-1.5 py-0.2 rounded-full text-[10px]" x-text="buyers.length"></span>
        </button>
        <button @click="page = 'suppliers'"
                :class="page === 'suppliers' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white'"
                class="px-4 py-1.5 rounded-md transition flex items-center gap-1.5">
          Suppliers Page
          <span class="bg-black/25 px-1.5 py-0.2 rounded-full text-[10px]" x-text="suppliers.length"></span>
        </button>
        <button @click="page = 'matrix'"
                :class="page === 'matrix' ? 'bg-amber-600 text-white shadow' : 'text-slate-300 hover:text-white'"
                class="px-4 py-1.5 rounded-md transition flex items-center gap-1.5">
          Deal Matrix
          <span class="bg-black/25 px-1.5 py-0.2 rounded-full text-[10px]" x-text="allBuyerProducts.length"></span>
        </button>
      </nav>
    </div>

    <div class="flex items-center gap-2">
      <a href="/api/export" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded text-xs font-medium">
        &#11015; Export CSV
      </a>
    </div>
  </header>

  <!-- ==================== PAGE 1: BUYERS PAGE ==================== -->
  <main x-show="page === 'buyers'" class="max-w-7xl w-full mx-auto p-6 flex-1">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- Left Sidebar: Buyer Search & List -->
      <aside class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-100 space-y-3 bg-slate-50/70">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Buyers List</h2>
            <button @click="openBuyerModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm">
              + Add Buyer
            </button>
          </div>
          <input type="text" x-model="buyerSearch" placeholder="Search buyer, contact, port, or product..."
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs bg-white focus:outline-none focus:border-blue-500" />
        </div>

        <div class="divide-y divide-slate-100 max-h-[72vh] overflow-y-auto">
          <template x-if="filteredBuyers.length === 0">
            <div class="p-6 text-center text-xs text-slate-400">No buyers found. Click "+ Add Buyer" above.</div>
          </template>
          <template x-for="b in filteredBuyers" :key="b.id">
            <div @click="selectedBuyerId = b.id"
                 :class="String(selectedBuyerId) === String(b.id) ? 'bg-blue-50 border-l-4 border-l-blue-600' : 'hover:bg-slate-50'"
                 class="p-3.5 cursor-pointer transition flex justify-between items-start">
              <div>
                <div class="font-bold text-slate-900 text-sm" x-text="b.company_name"></div>
                <div class="text-xs text-slate-500 mt-0.5" x-text="`${b.contact_person || 'No contact'} • ${b.destination_port || 'Port N/A'}`"></div>
              </div>
              <span class="bg-slate-100 text-slate-700 text-[11px] font-semibold px-2 py-0.5 rounded-full"
                    x-text="`${b.wanted_products.length} items`"></span>
            </div>
          </template>
        </div>
      </aside>

      <!-- Right Workspace: Selected Buyer Profile & Wanted Products -->
      <section class="lg:col-span-8 space-y-5">
        <template x-if="!activeBuyer">
          <div class="bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center space-y-2">
            <p class="font-semibold text-slate-700">Select a Buyer from the list</p>
            <p class="text-xs text-slate-500">View or add the products they want and link each product to a supplier.</p>
          </div>
        </template>

        <template x-if="activeBuyer">
          <div class="space-y-5">
            <!-- Buyer Info Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-wrap justify-between items-start gap-4">
              <div>
                <div class="flex items-center gap-2.5">
                  <span class="bg-blue-100 text-blue-800 text-[11px] font-bold px-2 py-0.5 rounded uppercase">Buyer</span>
                  <h2 class="text-xl font-bold text-slate-900" x-text="activeBuyer.company_name"></h2>
                </div>
                <div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-600">
                  <span><strong>Contact:</strong> <span x-text="activeBuyer.contact_person || '-'"></span></span>
                  <span>
                    <strong>Phone:</strong> <span x-text="activeBuyer.phone_whatsapp || '-'"></span>
                    <a x-show="activeBuyer.phone_whatsapp" :href="waLink(activeBuyer.phone_whatsapp)" target="_blank"
                       class="ml-1 bg-green-100 text-green-800 px-1.5 py-0.5 rounded text-[10px] font-bold">WA</a>
                  </span>
                  <span><strong>Email:</strong> <span x-text="activeBuyer.email || '-'"></span></span>
                  <span><strong>Port:</strong> <span x-text="activeBuyer.destination_port || '-'"></span></span>
                </div>
                <p x-show="activeBuyer.notes" class="mt-1.5 text-xs text-slate-500 italic" x-text="activeBuyer.notes"></p>
              </div>
              <div class="flex gap-2">
                <button @click="openBuyerModal(activeBuyer)" class="border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg text-xs font-semibold">Edit Buyer</button>
                <button @click="deleteBuyer(activeBuyer)" class="border border-red-200 text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg text-xs font-semibold">Delete</button>
              </div>
            </div>

            <!-- Wanted Products List for this Buyer -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3 bg-slate-50/70">
                <div>
                  <h3 class="font-bold text-slate-900 text-base">Products Wanted by <span x-text="activeBuyer.company_name"></span></h3>
                  <p class="text-xs text-slate-500">Assign a separate supplier and track progress for each required product.</p>
                </div>
                <button @click="openWantedProductModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-sm">
                  + Add Wanted Product
                </button>
              </div>

              <template x-if="activeBuyer.wanted_products.length === 0">
                <div class="p-10 text-center text-xs text-slate-400">
                  No products listed for this buyer yet. Click <strong>"+ Add Wanted Product"</strong> to add their requirements.
                </div>
              </template>

              <template x-if="activeBuyer.wanted_products.length > 0">
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                        <th class="p-3">Wanted Product & Specs</th>
                        <th class="p-3">Qty & Target</th>
                        <th class="p-3">Linked Supplier</th>
                        <th class="p-3">Supplier Quote & Margin</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      <template x-for="wp in activeBuyer.wanted_products" :key="wp.id">
                        <tr class="hover:bg-slate-50">
                          <td class="p-3 align-top">
                            <div class="font-bold text-slate-900 text-sm" x-text="wp.product_name"></div>
                            <div class="text-slate-500" x-text="wp.specifications || 'Standard'"></div>
                            <div x-show="wp.remarks" class="text-[11px] text-slate-400 mt-0.5 italic" x-text="wp.remarks"></div>
                          </td>
                          <td class="p-3 align-top">
                            <div class="font-semibold text-slate-800" x-text="`${wp.required_qty} ${wp.unit}`"></div>
                            <div class="text-slate-500" x-text="wp.target_price > 0 ? `Target: ${wp.currency} ${wp.target_price}` : 'Target: Open'"></div>
                          </td>
                          <td class="p-3 align-top min-w-[200px]">
                            <select x-model="wp.linked_supplier_id" @change="quickUpdateBuyerProduct(wp)"
                                    class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white font-medium">
                              <option value="">-- Unlinked (Select Supplier) --</option>
                              <template x-for="s in suppliers" :key="s.id">
                                <option :value="s.id" x-text="supplierOptionLabel(s, wp.product_name)"></option>
                              </template>
                            </select>
                            <!-- Direct Clickable Link to Supplier Page -->
                            <div x-show="wp.linked_supplier_id" class="mt-1.5 flex items-center gap-2">
                              <button @click="jumpToSupplier(wp.linked_supplier_id)"
                                      class="text-[11px] text-emerald-700 hover:underline font-semibold flex items-center gap-1">
                                &rarr; Open Supplier Profile
                              </button>
                              <a x-show="wp.linked_supplier_phone" :href="waLink(wp.linked_supplier_phone)" target="_blank"
                                 class="bg-green-100 text-green-800 px-1.5 py-0.2 rounded text-[10px] font-bold">WA</a>
                            </div>
                          </td>
                          <td class="p-3 align-top">
                            <div class="flex items-center gap-1">
                              <span class="text-slate-400" x-text="wp.currency"></span>
                              <input type="number" step="0.01" x-model.number="wp.supplier_quote_price" @change="quickUpdateBuyerProduct(wp)"
                                     class="w-20 border border-slate-300 rounded px-1.5 py-1 text-xs font-semibold" />
                            </div>
                            <div x-show="wp.target_price > 0 && wp.supplier_quote_price > 0" class="mt-1 font-bold text-[11px]"
                                 :class="calcMargin(wp.target_price, wp.supplier_quote_price) >= 0 ? 'text-emerald-600' : 'text-red-600'"
                                 x-text="`Margin: ${calcMargin(wp.target_price, wp.supplier_quote_price)}%`"></div>
                          </td>
                          <td class="p-3 align-top">
                            <select x-model="wp.status" @change="quickUpdateBuyerProduct(wp)"
                                    :class="statusClass(wp.status)"
                                    class="rounded-full px-2.5 py-1 text-xs font-bold border cursor-pointer">
                              <option>Not Started</option>
                              <option>Pending</option>
                              <option>In Progress</option>
                              <option>Active</option>
                            </select>
                          </td>
                          <td class="p-3 align-top text-right space-x-2 whitespace-nowrap">
                            <button @click="openWantedProductModal(wp)" class="text-blue-600 hover:underline font-semibold">Edit</button>
                            <button @click="deleteWantedProduct(wp.id)" class="text-red-500 hover:underline font-semibold">Delete</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>
    </div>
  </main>

  <!-- ==================== PAGE 2: SUPPLIERS PAGE ==================== -->
  <main x-show="page === 'suppliers'" class="max-w-7xl w-full mx-auto p-6 flex-1" style="display:none;">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- Left Sidebar: Supplier Search & List -->
      <aside class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-100 space-y-3 bg-slate-50/70">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Suppliers List</h2>
            <button @click="openSupplierModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm">
              + Add Supplier
            </button>
          </div>
          <input type="text" x-model="supplierSearch" placeholder="Search supplier, city, or product supplied..."
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs bg-white focus:outline-none focus:border-emerald-500" />
        </div>

        <div class="divide-y divide-slate-100 max-h-[72vh] overflow-y-auto">
          <template x-if="filteredSuppliers.length === 0">
            <div class="p-6 text-center text-xs text-slate-400">No suppliers found. Click "+ Add Supplier" above.</div>
          </template>
          <template x-for="s in filteredSuppliers" :key="s.id">
            <div @click="selectedSupplierId = s.id"
                 :class="String(selectedSupplierId) === String(s.id) ? 'bg-emerald-50 border-l-4 border-l-emerald-600' : 'hover:bg-slate-50'"
                 class="p-3.5 cursor-pointer transition flex justify-between items-start">
              <div>
                <div class="font-bold text-slate-900 text-sm" x-text="s.company_name"></div>
                <div class="text-xs text-slate-500 mt-0.5" x-text="`${s.contact_person || 'No contact'} • ${s.city_country || 'Location N/A'}`"></div>
              </div>
              <span class="bg-slate-100 text-slate-700 text-[11px] font-semibold px-2 py-0.5 rounded-full"
                    x-text="`${s.supplied_products.length} supplied`"></span>
            </div>
          </template>
        </div>
      </aside>

      <!-- Right Workspace: Selected Supplier Profile & Supplied Catalog -->
      <section class="lg:col-span-8 space-y-5">
        <template x-if="!activeSupplier">
          <div class="bg-white rounded-xl border border-dashed border-slate-300 p-12 text-center space-y-2">
            <p class="font-semibold text-slate-700">Select a Supplier from the list</p>
            <p class="text-xs text-slate-500">Manage the products they can supply and view linked buyer requirements.</p>
          </div>
        </template>

        <template x-if="activeSupplier">
          <div class="space-y-5">
            <!-- Supplier Info Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-wrap justify-between items-start gap-4">
              <div>
                <div class="flex items-center gap-2.5">
                  <span class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-0.5 rounded uppercase">Supplier</span>
                  <h2 class="text-xl font-bold text-slate-900" x-text="activeSupplier.company_name"></h2>
                </div>
                <div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-600">
                  <span><strong>Contact:</strong> <span x-text="activeSupplier.contact_person || '-'"></span></span>
                  <span>
                    <strong>Phone:</strong> <span x-text="activeSupplier.phone_whatsapp || '-'"></span>
                    <a x-show="activeSupplier.phone_whatsapp" :href="waLink(activeSupplier.phone_whatsapp)" target="_blank"
                       class="ml-1 bg-green-100 text-green-800 px-1.5 py-0.5 rounded text-[10px] font-bold">WA</a>
                  </span>
                  <span><strong>Email:</strong> <span x-text="activeSupplier.email || '-'"></span></span>
                  <span><strong>Location:</strong> <span x-text="activeSupplier.city_country || '-'"></span></span>
                </div>
                <div x-show="activeSupplier.certifications" class="mt-1.5 text-xs text-blue-700 font-semibold">
                  Certifications: <span x-text="activeSupplier.certifications"></span>
                </div>
              </div>
              <div class="flex gap-2">
                <button @click="openSupplierModal(activeSupplier)" class="border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg text-xs font-semibold">Edit Supplier</button>
                <button @click="deleteSupplier(activeSupplier)" class="border border-red-200 text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg text-xs font-semibold">Delete</button>
              </div>
            </div>

            <!-- Products Supplied Catalog -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3 bg-slate-50/70">
                <div>
                  <h3 class="font-bold text-slate-900 text-base">Products Supplied by <span x-text="activeSupplier.company_name"></span></h3>
                  <p class="text-xs text-slate-500">Catalog of products this vendor can supply, with MOQ, pricing, and availability status.</p>
                </div>
                <button @click="openSuppliedProductModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-sm">
                  + Add Supplied Product
                </button>
              </div>

              <template x-if="activeSupplier.supplied_products.length === 0">
                <div class="p-10 text-center text-xs text-slate-400">
                  No catalog items added for this supplier yet. Click <strong>"+ Add Supplied Product"</strong> to list what they supply.
                </div>
              </template>

              <template x-if="activeSupplier.supplied_products.length > 0">
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                        <th class="p-3">Product Name & Specs</th>
                        <th class="p-3">Base Price</th>
                        <th class="p-3">MOQ & Lead Time</th>
                        <th class="p-3">Catalog Status</th>
                        <th class="p-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      <template x-for="sp in activeSupplier.supplied_products" :key="sp.id">
                        <tr class="hover:bg-slate-50">
                          <td class="p-3">
                            <div class="font-bold text-slate-900 text-sm" x-text="sp.product_name"></div>
                            <div class="text-slate-500" x-text="sp.specifications || 'Standard'"></div>
                            <div x-show="sp.remarks" class="text-[11px] text-slate-400 italic mt-0.5" x-text="sp.remarks"></div>
                          </td>
                          <td class="p-3 font-semibold text-slate-800" x-text="sp.unit_price > 0 ? `${sp.currency} ${sp.unit_price} / ${sp.unit}` : 'On Request'"></td>
                          <td class="p-3 text-slate-600">
                            <div>MOQ: <strong x-text="`${sp.moq} ${sp.unit}`"></strong></div>
                            <div>Lead: <strong x-text="`${sp.lead_time_days} days`"></strong></div>
                          </td>
                          <td class="p-3">
                            <select x-model="sp.status" @change="quickUpdateSupplierProduct(sp)"
                                    :class="statusClass(sp.status)"
                                    class="rounded-full px-2.5 py-1 text-xs font-bold border cursor-pointer">
                              <option>Active</option>
                              <option>In Progress</option>
                              <option>Pending</option>
                              <option>Not Started</option>
                            </select>
                          </td>
                          <td class="p-3 text-right space-x-2 whitespace-nowrap">
                            <button @click="openSuppliedProductModal(sp)" class="text-blue-600 hover:underline font-semibold">Edit</button>
                            <button @click="deleteSuppliedProduct(sp.id)" class="text-red-500 hover:underline font-semibold">Delete</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>

            <!-- Linked Buyer Requirements (Reverse Link View) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="px-5 py-3.5 border-b border-slate-100 bg-slate-50/70">
                <h3 class="font-bold text-slate-800 text-sm">Linked Buyer Requirements (<span x-text="activeSupplier.linked_deals.length"></span>)</h3>
              </div>
              <template x-if="activeSupplier.linked_deals.length === 0">
                <p class="p-5 text-xs text-slate-400">No buyer products are linked to this supplier yet.</p>
              </template>
              <template x-if="activeSupplier.linked_deals.length > 0">
                <div class="divide-y divide-slate-100">
                  <template x-for="deal in activeSupplier.linked_deals" :key="deal.id">
                    <div class="p-3.5 flex flex-wrap justify-between items-center gap-3 text-xs hover:bg-slate-50">
                      <div>
                        <span class="font-bold text-slate-900" x-text="deal.product_name"></span>
                        <span class="text-slate-500"> &bull; Qty: <strong x-text="`${deal.required_qty} ${deal.unit}`"></strong></span>
                        <div class="mt-0.5">
                          Buyer: <button @click="jumpToBuyer(deal.buyer_id)" class="text-blue-600 hover:underline font-semibold" x-text="deal.buyer_name"></button>
                        </div>
                      </div>
                      <span :class="statusClass(deal.status)" class="px-2.5 py-1 rounded-full font-bold border" x-text="deal.status"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>

          </div>
        </template>
      </section>
    </div>
  </main>

  <!-- ==================== PAGE 3: UNIFIED DEAL MATRIX ==================== -->
  <main x-show="page === 'matrix'" class="max-w-7xl w-full mx-auto p-6 flex-1 space-y-5" style="display:none;">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-2 text-xs font-semibold">
        <span class="text-slate-500 mr-1">Filter Status:</span>
        <button @click="matrixStatusFilter = 'ALL'" :class="matrixStatusFilter === 'ALL' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'" class="px-3 py-1.5 rounded-lg">All (<span x-text="allBuyerProducts.length"></span>)</button>
        <button @click="matrixStatusFilter = 'Active'" :class="matrixStatusFilter === 'Active' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-800'" class="px-3 py-1.5 rounded-lg">Active</button>
        <button @click="matrixStatusFilter = 'In Progress'" :class="matrixStatusFilter === 'In Progress' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-800'" class="px-3 py-1.5 rounded-lg">In Progress</button>
        <button @click="matrixStatusFilter = 'Pending'" :class="matrixStatusFilter === 'Pending' ? 'bg-amber-500 text-white' : 'bg-amber-50 text-amber-800'" class="px-3 py-1.5 rounded-lg">Pending</button>
        <button @click="matrixStatusFilter = 'Not Started'" :class="matrixStatusFilter === 'Not Started' ? 'bg-slate-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-lg">Not Started</button>
      </div>
      <input type="text" x-model="matrixSearch" placeholder="Search buyer, product, or supplier..."
             class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs w-64" />
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
              <th class="p-3">Buyer</th>
              <th class="p-3">Wanted Product</th>
              <th class="p-3">Qty & Target</th>
              <th class="p-3">Linked Supplier</th>
              <th class="p-3">Quote & Margin</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <template x-for="row in filteredMatrix" :key="row.id">
              <tr class="hover:bg-slate-50">
                <td class="p-3">
                  <button @click="jumpToBuyer(row.buyer_id)" class="font-bold text-blue-700 hover:underline text-sm" x-text="row.buyer_name"></button>
                </td>
                <td class="p-3">
                  <div class="font-bold text-slate-900" x-text="row.product_name"></div>
                  <div class="text-slate-500" x-text="row.specifications || '-'"></div>
                </td>
                <td class="p-3">
                  <div class="font-semibold" x-text="`${row.required_qty} ${row.unit}`"></div>
                  <div class="text-slate-500" x-text="row.target_price > 0 ? `${row.currency} ${row.target_price}` : '-'"></div>
                </td>
                <td class="p-3">
                  <template x-if="row.linked_supplier_id">
                    <button @click="jumpToSupplier(row.linked_supplier_id)" class="font-bold text-emerald-700 hover:underline" x-text="row.linked_supplier_name"></button>
                  </template>
                  <template x-if="!row.linked_supplier_id">
                    <span class="text-slate-400 italic">Unlinked</span>
                  </template>
                </td>
                <td class="p-3">
                  <div class="font-semibold" x-text="row.supplier_quote_price > 0 ? `${row.currency} ${row.supplier_quote_price}` : '-'"></div>
                  <div x-show="row.target_price > 0 && row.supplier_quote_price > 0" class="font-bold text-[11px]"
                       :class="calcMargin(row.target_price, row.supplier_quote_price) >= 0 ? 'text-emerald-600' : 'text-red-600'"
                       x-text="`${calcMargin(row.target_price, row.supplier_quote_price)}%`"></div>
                </td>
                <td class="p-3">
                  <select x-model="row.status" @change="quickUpdateBuyerProduct(row)"
                          :class="statusClass(row.status)"
                          class="rounded-full px-2.5 py-1 text-xs font-bold border">
                    <option>Not Started</option>
                    <option>Pending</option>
                    <option>In Progress</option>
                    <option>Active</option>
                  </select>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ==================== MODALS ==================== -->

  <!-- MODAL: ADD / EDIT BUYER -->
  <div x-show="modals.buyer" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" style="display:none;">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
      <h3 class="text-lg font-bold" x-text="forms.buyer.id ? 'Edit Buyer' : 'Add New Buyer'"></h3>
      <div class="space-y-3 text-sm">
        <input x-model="forms.buyer.company_name" placeholder="Buyer Company Name *" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.buyer.contact_person" placeholder="Contact Person" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.buyer.phone_whatsapp" placeholder="Phone / WhatsApp" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.buyer.email" placeholder="Email Address" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.buyer.destination_port" placeholder="Destination Port / City" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.buyer.notes" placeholder="Payment Terms / Notes" class="w-full border rounded-lg px-3 py-2" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modals.buyer = false" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button @click="saveBuyer()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save Buyer</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT SUPPLIER -->
  <div x-show="modals.supplier" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" style="display:none;">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
      <h3 class="text-lg font-bold" x-text="forms.supplier.id ? 'Edit Supplier' : 'Add New Supplier'"></h3>
      <div class="space-y-3 text-sm">
        <input x-model="forms.supplier.company_name" placeholder="Supplier Company Name *" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.supplier.contact_person" placeholder="Sales Contact Person" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.supplier.phone_whatsapp" placeholder="Phone / WhatsApp" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.supplier.email" placeholder="Email Address" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.supplier.city_country" placeholder="City & Country" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.supplier.certifications" placeholder="Certifications (ISO, FSSAI, APEDA, FAA...)" class="w-full border rounded-lg px-3 py-2" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modals.supplier = false" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button @click="saveSupplier()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save Supplier</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT BUYER WANTED PRODUCT -->
  <div x-show="modals.wantedProduct" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" style="display:none;">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl">
      <h3 class="text-lg font-bold" x-text="forms.wantedProduct.id ? 'Edit Wanted Product' : 'Add Product Wanted by Buyer'"></h3>
      <div class="space-y-3 text-sm">
        <input x-model="forms.wantedProduct.product_name" placeholder="Product Name *" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.wantedProduct.specifications" placeholder="Grade / Specifications / Packaging" class="w-full border rounded-lg px-3 py-2" />
        <div class="grid grid-cols-3 gap-2">
          <input type="number" x-model="forms.wantedProduct.required_qty" placeholder="Quantity" class="border rounded-lg px-3 py-2" />
          <input x-model="forms.wantedProduct.unit" placeholder="Unit (KG, MT, PCS)" class="border rounded-lg px-3 py-2" />
          <select x-model="forms.wantedProduct.currency" class="border rounded-lg px-3 py-2">
            <option>USD</option><option>INR</option><option>EUR</option><option>AED</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-500 font-semibold">Buyer Target Price</label>
            <input type="number" step="0.01" x-model="forms.wantedProduct.target_price" placeholder="0.00" class="w-full border rounded-lg px-3 py-2 mt-1" />
          </div>
          <div>
            <label class="text-xs text-slate-500 font-semibold">Workflow Status</label>
            <select x-model="forms.wantedProduct.status" class="w-full border rounded-lg px-3 py-2 mt-1">
              <option>Not Started</option>
              <option>Pending</option>
              <option>In Progress</option>
              <option>Active</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-500 font-semibold">Link Supplier for This Product</label>
          <select x-model="forms.wantedProduct.linked_supplier_id" class="w-full border rounded-lg px-3 py-2 mt-1">
            <option value="">-- Unlinked (Assign Later) --</option>
            <template x-for="s in suppliers" :key="s.id">
              <option :value="s.id" x-text="supplierOptionLabel(s, forms.wantedProduct.product_name)"></option>
            </template>
          </select>
        </div>
        <input type="number" step="0.01" x-model="forms.wantedProduct.supplier_quote_price" placeholder="Supplier Quoted Price (optional)" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.wantedProduct.remarks" placeholder="Remarks / Sample status / Delivery notes" class="w-full border rounded-lg px-3 py-2" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modals.wantedProduct = false" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button @click="saveWantedProduct()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save Product</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT SUPPLIER CATALOG PRODUCT -->
  <div x-show="modals.suppliedProduct" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" style="display:none;">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl">
      <h3 class="text-lg font-bold" x-text="forms.suppliedProduct.id ? 'Edit Supplied Product' : 'Add Product Supplier Can Supply'"></h3>
      <div class="space-y-3 text-sm">
        <input x-model="forms.suppliedProduct.product_name" placeholder="Product Name *" class="w-full border rounded-lg px-3 py-2" />
        <input x-model="forms.suppliedProduct.specifications" placeholder="Grade / Specifications" class="w-full border rounded-lg px-3 py-2" />
        <div class="grid grid-cols-3 gap-2">
          <input type="number" step="0.01" x-model="forms.suppliedProduct.unit_price" placeholder="Unit Price" class="border rounded-lg px-3 py-2" />
          <select x-model="forms.suppliedProduct.currency" class="border rounded-lg px-3 py-2">
            <option>USD</option><option>INR</option><option>EUR</option><option>AED</option>
          </select>
          <input x-model="forms.suppliedProduct.unit" placeholder="Unit (KG, PCS)" class="border rounded-lg px-3 py-2" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" x-model="forms.suppliedProduct.moq" placeholder="Minimum Order Qty (MOQ)" class="border rounded-lg px-3 py-2" />
          <input type="number" x-model="forms.suppliedProduct.lead_time_days" placeholder="Lead Time (Days)" class="border rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="text-xs text-slate-500 font-semibold">Supply Status</label>
          <select x-model="forms.suppliedProduct.status" class="w-full border rounded-lg px-3 py-2 mt-1">
            <option>Active</option>
            <option>In Progress</option>
            <option>Pending</option>
            <option>Not Started</option>
          </select>
        </div>
        <input x-model="forms.suppliedProduct.remarks" placeholder="Notes / Packaging / Certifications" class="w-full border rounded-lg px-3 py-2" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modals.suppliedProduct = false" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button @click="saveSuppliedProduct()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save Catalog Item</button>
      </div>
    </div>
  </div>

  <script>
    function glApp() {
      return {
        page: 'buyers',
        buyers: [],
        suppliers: [],
        selectedBuyerId: '',
        selectedSupplierId: '',
        buyerSearch: '',
        supplierSearch: '',
        matrixSearch: '',
        matrixStatusFilter: 'ALL',
        modals: { buyer: false, supplier: false, wantedProduct: false, suppliedProduct: false },
        forms: {
          buyer: { id: null, company_name: '', contact_person: '', phone_whatsapp: '', email: '', destination_port: '', notes: '' },
          supplier: { id: null, company_name: '', contact_person: '', phone_whatsapp: '', email: '', city_country: '', certifications: '' },
          wantedProduct: { id: null, product_name: '', specifications: '', required_qty: '', unit: 'KG', target_price: '', currency: 'USD', linked_supplier_id: '', supplier_quote_price: '', status: 'Not Started', remarks: '' },
          suppliedProduct: { id: null, product_name: '', specifications: '', unit_price: '', currency: 'USD', moq: '', unit: 'KG', lead_time_days: '', status: 'Active', remarks: '' },
        },

        get activeBuyer() {
          return this.buyers.find((b) => String(b.id) === String(this.selectedBuyerId)) || null;
        },

        get activeSupplier() {
          return this.suppliers.find((s) => String(s.id) === String(this.selectedSupplierId)) || null;
        },

        get filteredBuyers() {
          const q = this.buyerSearch.toLowerCase().trim();
          if (!q) return this.buyers;
          return this.buyers.filter((b) => {
            const matchProfile = [b.company_name, b.contact_person, b.phone_whatsapp, b.email, b.destination_port].some((f) =>
              String(f || '').toLowerCase().includes(q)
            );
            const matchProd = b.wanted_products.some((p) => String(p.product_name || '').toLowerCase().includes(q));
            return matchProfile || matchProd;
          });
        },

        get filteredSuppliers() {
          const q = this.supplierSearch.toLowerCase().trim();
          if (!q) return this.suppliers;
          return this.suppliers.filter((s) => {
            const matchProfile = [s.company_name, s.contact_person, s.phone_whatsapp, s.email, s.city_country, s.certifications].some((f) =>
              String(f || '').toLowerCase().includes(q)
            );
            const matchProd = s.supplied_products.some((p) => String(p.product_name || '').toLowerCase().includes(q));
            return matchProfile || matchProd;
          });
        },

        get allBuyerProducts() {
          const list = [];
          for (const b of this.buyers) {
            for (const wp of b.wanted_products) {
              list.push({ ...wp, buyer_name: b.company_name });
            }
          }
          return list;
        },

        get filteredMatrix() {
          const q = this.matrixSearch.toLowerCase().trim();
          return this.allBuyerProducts.filter((row) => {
            const statusOk = this.matrixStatusFilter === 'ALL' || row.status === this.matrixStatusFilter;
            const searchOk =
              !q ||
              [row.buyer_name, row.product_name, row.specifications, row.linked_supplier_name].some((f) =>
                String(f || '').toLowerCase().includes(q)
              );
            return statusOk && searchOk;
          });
        },

        async init() {
          await this.loadWorkspace();
          if (this.buyers.length > 0 && !this.selectedBuyerId) this.selectedBuyerId = this.buyers[0].id;
          if (this.suppliers.length > 0 && !this.selectedSupplierId) this.selectedSupplierId = this.suppliers[0].id;
        },

        async loadWorkspace() {
          const res = await fetch('/api/workspace');
          const data = await res.json();
          this.buyers = data.buyers || [];
          this.suppliers = data.suppliers || [];
        },

        statusClass(status) {
          switch (status) {
            case 'Active':
              return 'bg-emerald-100 text-emerald-800 border-emerald-300';
            case 'In Progress':
              return 'bg-blue-100 text-blue-800 border-blue-300';
            case 'Pending':
              return 'bg-amber-100 text-amber-800 border-amber-300';
            default:
              return 'bg-slate-100 text-slate-700 border-slate-300';
          }
        },

        supplierOptionLabel(supplier, wantedProductName) {
          const query = String(wantedProductName || '').toLowerCase().trim();
          const hasMatch =
            query &&
            supplier.supplied_products.some((sp) => String(sp.product_name || '').toLowerCase().includes(query));
          return hasMatch
            ? `★ ${supplier.company_name} (Supplies this!)`
            : `${supplier.company_name}${supplier.city_country ? ' — ' + supplier.city_country : ''}`;
        },

        calcMargin(target, quote) {
          if (!target || !quote) return 0;
          return (((target - quote) / target) * 100).toFixed(1);
        },

        waLink(phone) {
          const clean = String(phone || '').replace(/[^0-9]/g, '');
          return clean ? `https://wa.me/${clean}` : '#';
        },

        jumpToSupplier(supplierId) {
          this.selectedSupplierId = supplierId;
          this.page = 'suppliers';
        },

        jumpToBuyer(buyerId) {
          this.selectedBuyerId = buyerId;
          this.page = 'buyers';
        },

        // --- BUYER CRUD ---
        openBuyerModal(b = null) {
          this.forms.buyer = b
            ? { ...b }
            : { id: null, company_name: '', contact_person: '', phone_whatsapp: '', email: '', destination_port: '', notes: '' };
          this.modals.buyer = true;
        },

        async saveBuyer() {
          if (!this.forms.buyer.company_name) return alert('Buyer company name is required');
          const isEdit = Boolean(this.forms.buyer.id);
          const res = await fetch(isEdit ? `/api/buyers/${this.forms.buyer.id}` : '/api/buyers', {
            method: isEdit ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.forms.buyer),
          });
          const saved = await res.json();
          this.modals.buyer = false;
          await this.loadWorkspace();
          if (!isEdit && saved.id) this.selectedBuyerId = saved.id;
        },

        async deleteBuyer(b) {
          if (!confirm(`Delete buyer "${b.company_name}" and all their wanted products?`)) return;
          await fetch(`/api/buyers/${b.id}`, { method: 'DELETE' });
          this.selectedBuyerId = '';
          await this.loadWorkspace();
          if (this.buyers.length > 0) this.selectedBuyerId = this.buyers[0].id;
        },

        // --- SUPPLIER CRUD ---
        openSupplierModal(s = null) {
          this.forms.supplier = s
            ? { ...s }
            : { id: null, company_name: '', contact_person: '', phone_whatsapp: '', email: '', city_country: '', certifications: '' };
          this.modals.supplier = true;
        },

        async saveSupplier() {
          if (!this.forms.supplier.company_name) return alert('Supplier company name is required');
          const isEdit = Boolean(this.forms.supplier.id);
          const res = await fetch(isEdit ? `/api/suppliers/${this.forms.supplier.id}` : '/api/suppliers', {
            method: isEdit ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.forms.supplier),
          });
          const saved = await res.json();
          this.modals.supplier = false;
          await this.loadWorkspace();
          if (!isEdit && saved.id) this.selectedSupplierId = saved.id;
        },

        async deleteSupplier(s) {
          if (!confirm(`Delete supplier "${s.company_name}"?`)) return;
          await fetch(`/api/suppliers/${s.id}`, { method: 'DELETE' });
          this.selectedSupplierId = '';
          await this.loadWorkspace();
          if (this.suppliers.length > 0) this.selectedSupplierId = this.suppliers[0].id;
        },

        // --- BUYER WANTED PRODUCTS ---
        openWantedProductModal(wp = null) {
          this.forms.wantedProduct = wp
            ? { ...wp, linked_supplier_id: wp.linked_supplier_id || '' }
            : { id: null, product_name: '', specifications: '', required_qty: '', unit: 'KG', target_price: '', currency: 'USD', linked_supplier_id: '', supplier_quote_price: '', status: 'Not Started', remarks: '' };
          this.modals.wantedProduct = true;
        },

        async saveWantedProduct() {
          if (!this.forms.wantedProduct.product_name) return alert('Product name is required');
          const isEdit = Boolean(this.forms.wantedProduct.id);
          const payload = { ...this.forms.wantedProduct, buyer_id: this.activeBuyer.id };
          await fetch(isEdit ? `/api/buyer-products/${this.forms.wantedProduct.id}` : '/api/buyer-products', {
            method: isEdit ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          this.modals.wantedProduct = false;
          await this.loadWorkspace();
        },

        async quickUpdateBuyerProduct(wp) {
          await fetch(`/api/buyer-products/${wp.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(wp),
          });
          await this.loadWorkspace();
        },

        async deleteWantedProduct(id) {
          if (!confirm('Remove this wanted product?')) return;
          await fetch(`/api/buyer-products/${id}`, { method: 'DELETE' });
          await this.loadWorkspace();
        },

        // --- SUPPLIER CATALOG PRODUCTS ---
        openSuppliedProductModal(sp = null) {
          this.forms.suppliedProduct = sp
            ? { ...sp }
            : { id: null, product_name: '', specifications: '', unit_price: '', currency: 'USD', moq: '', unit: 'KG', lead_time_days: '', status: 'Active', remarks: '' };
          this.modals.suppliedProduct = true;
        },

        async saveSuppliedProduct() {
          if (!this.forms.suppliedProduct.product_name) return alert('Product name is required');
          const isEdit = Boolean(this.forms.suppliedProduct.id);
          const payload = { ...this.forms.suppliedProduct, supplier_id: this.activeSupplier.id };
          await fetch(isEdit ? `/api/supplier-products/${this.forms.suppliedProduct.id}` : '/api/supplier-products', {
            method: isEdit ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          this.modals.suppliedProduct = false;
          await this.loadWorkspace();
        },

        async quickUpdateSupplierProduct(sp) {
          await fetch(`/api/supplier-products/${sp.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(sp),
          });
          await this.loadWorkspace();
        },

        async deleteSuppliedProduct(id) {
          if (!confirm('Remove this catalog product?')) return;
          await fetch(`/api/supplier-products/${id}`, { method: 'DELETE' });
          await this.loadWorkspace();
        },
      };
    }
  </script>
</body>
</html>
